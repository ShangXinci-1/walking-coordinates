name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - codex/frontend-redesign

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          node -e "const { chromium } = require('@playwright/test'); console.log('CHROME_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Code, data, asset and static export checks
        run: npm run check

      - name: Browser and accessibility tests
        run: npx playwright test --grep-invert @visual

      - name: Lighthouse release gates
        run: npm run test:lighthouse

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-results/
          if-no-files-found: ignore
